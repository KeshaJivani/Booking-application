<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | BookMyStay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: #f3f4f6;
            color: #333;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.5rem; font-weight: bold; color: #0066cc; }
        nav { display: flex; gap: 2rem; }
        nav a { text-decoration: none; color: #666; font-weight: 500; transition: color 0.3s; }
        nav a:hover { color: #0066cc; }

        .hero {
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
        }

        .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .hero p { font-size: 1.1rem; opacity: 0.9; }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .form-container {
            max-width: 450px;
            margin: -3rem auto 0;
            padding: 2rem;
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
        }

        .form-container h2 {
            font-size: 1.875rem;
            font-weight: bold;
            color: #0066cc;
            margin-bottom: 0.5rem;
        }

        .form-container p {
            color: #6b7280;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1f2937;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #6b7280;
            font-size: 1.25rem;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            margin: 0;
            font-weight: 400;
        }

        .remember-forgot a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .sign-in-btn {
            width: 100%;
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow 0.3s;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .sign-in-btn:hover {
            box-shadow: 0 10px 15px rgba(0, 102, 204, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #d1d5db;
        }

        .divider::before {
            content: '';
            flex: 1;
            height: 1px;
            background: #d1d5db;
        }

        .divider span {
            padding: 0 0.75rem;
            color: #6b7280;
        }

        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #d1d5db;
        }

        .social-login {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .social-btn {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            color: #1f2937;
        }

        .social-btn:hover {
            background: #f9fafb;
        }

        .signup-link {
            text-align: center;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .signup-link a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        footer {
            background-color: #1f2937;
            color: #fff;
            padding: 2rem 0;
            text-align: center;
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            nav { display: none; }
            .form-container { margin: -2rem 0 0; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">BookMyStay</div>
            <nav>
                <a href="index.html">Home</a>
                <a href="signin.html" style="color: #0066cc;">Sign In</a>
                <a href="register.html">Register</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <h1>Welcome Back</h1>
        <p>Sign in to your BookMyStay account and continue your journey</p>
    </section>

    <div class="container">
        <div class="form-container">
            <h2>Sign In</h2>
            <p>Enter your credentials to access your account</p>

            <form onsubmit="handleSignIn(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                    </div>
                </div>

                <div class="remember-forgot">
                    <label>
                        <input type="checkbox" name="remember" id="remember">
                        Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="sign-in-btn">🔐 Sign In</button>

                <div class="divider">
                    <span>Or</span>
                </div>

                <div class="social-login">
                    <button type="button" class="social-btn">Google</button>
                    <button type="button" class="social-btn">Facebook</button>
                </div>

                <div class="signup-link">
                    Don't have an account? <a href="register.html">Create one here</a>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 BookMyStay. All rights reserved.</p>
    </footer>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const button = document.querySelector('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                button.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                button.textContent = '👁️';
            }
        }

        function handleSignIn(event) {
            event.preventDefault();
            alert('Welcome back to BookMyStay! You\'ve been signed in successfully.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
